[workspace]
resolver = "2"
members = ["crates/adapter"]
exclude = [".scratch", "bootstrap", "crates/core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/enkhjile/semantic-release-workspace-e2e-cargo"

[workspace.dependencies]
enkhjile-srw-e2e-core = { version = "=0.2.0-alpha.1" }
