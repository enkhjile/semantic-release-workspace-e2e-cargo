[workspace]
resolver = "2"
members = ["crates/core", "crates/outer", "crates/outer/inner", "crates/outer/inner/nested"]
exclude = [".scratch", "bootstrap"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/enkhjile/semantic-release-workspace-e2e-cargo"

[workspace.dependencies]
enkhjile-srw-e2e-core = { path = "crates/core", version = "0.4.0-alpha7.1" }
