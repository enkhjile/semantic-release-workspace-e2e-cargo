[workspace]
resolver = "2"
members = ["crates/core", "crates/outer", "crates/outer/inner", "crates/outer/inner/nested"]
exclude = [".scratch"]

[workspace.package]
version = "1.0.0-alpha.6"
edition = "2024"
license = "MIT"
repository = "https://github.com/enkhjile/semantic-release-workspace-e2e-cargo"

[workspace.dependencies]
enkhjile-srw-e2e-core = { version = "=1.0.0-alpha.6" }
