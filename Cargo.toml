[workspace]
resolver = "2"
members = ["crates/*"]
exclude = [".scratch", "bootstrap"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/enkhjile/semantic-release-workspace-e2e-cargo"

[workspace.dependencies]
enkhjile-srw-e2e-core = { path = "crates/core", version = "0.1.0" }
