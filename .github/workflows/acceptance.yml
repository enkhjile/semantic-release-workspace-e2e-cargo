name: Cargo shared-version native branch checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - run: rustup toolchain install 1.99.1 --profile minimal --no-self-update
      - run: npm install --global npm@12.2.1 pnpm@12.15.0
      - run: echo "ACCEPTANCE_NPM_CLI=$(readlink -f "$(command -v npm)")" >> "$GITHUB_ENV"
      - name: Rebuild pinned candidate before native immutable install
        run: node scripts/build-candidate.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: cargo test --workspace --locked
      - run: npm test
      - if: always()
        run: rm -rf node_modules target .scratch vendor/shared-version-candidate.tgz "$RUNNER_TEMP/shared-version-candidate-source" "$RUNNER_TEMP/shared-version-pnpm-store"
