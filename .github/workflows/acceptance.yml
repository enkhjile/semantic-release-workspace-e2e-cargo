name: Cargo alpha.6 consumer acceptance
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: workspace-release
  cancel-in-progress: false
jobs:
  controlled:
    runs-on: ubuntu-latest
    env:
      CARGO_EVIDENCE_DIR: evidence/alpha6/hosted
      CARGO_SCRATCH_DIR: .scratch/alpha6-hosted
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm install --global npm@12.2.1
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Native Cargo test
        run: cargo test --workspace --locked
      - name: Documented package-name contract
        id: documented
        continue-on-error: true
        run: npm test
      - name: Controlled Cargo lifecycle
        if: always()
        run: node scripts/lifecycle.mjs
      - name: Preserve disposable Git histories
        if: always()
        run: python3 scripts/export-alpha6-evidence.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: cargo-evidence
          path: evidence/alpha6/
      - name: Preserve alpha.6 contract verdict
        if: steps.documented.outcome != 'success'
        run: exit 1
