name: Cargo alpha.7 public consumer acceptance
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: workspace-release
  cancel-in-progress: false
jobs:
  controlled:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.99.1
      CARGO_EVIDENCE_DIR: evidence/alpha7/hosted
      CARGO_SCRATCH_DIR: .scratch/alpha7-hosted
      npm_config_cache: .scratch/alpha7-install-cache
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
      - run: npm install --global npm@12.2.1
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Frozen public CLI native Cargo acceptance and cleanup
        run: node scripts/run-alpha7.mjs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: cargo-evidence
          path: evidence/alpha7/
