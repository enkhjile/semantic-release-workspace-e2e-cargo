name: Alpha.6 exact required-OIDC preview (no publication)
on:
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: alpha6-read-only-preview
  cancel-in-progress: false
jobs:
  required-oidc-preview:
    if: github.ref == 'refs/heads/stable-alpha6-live'
    environment: cargo-live
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
      - run: npm install --global npm@12.2.1
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund
      - run: rustup toolchain install 1.99.1 --profile minimal --no-self-update
      - run: cargo test --workspace --locked
      - name: Validate exact preview guard and native executables
        run: |
          mkdir -p evidence/alpha6-preview
          node --test scripts/preview-alpha6.test.mjs
          node --version > evidence/alpha6-preview/tools.txt
          command -v npm >> evidence/alpha6-preview/tools.txt
          npm --version >> evidence/alpha6-preview/tools.txt
          echo "ACCEPTANCE_NPM_PATH=$(dirname "$(command -v npm)")" >> "$GITHUB_ENV"
      - name: Required-OIDC dry-run and immutable public/source/ref assertions
        run: node scripts/preview-alpha6.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: alpha6-preview-cargo
          path: evidence/alpha6-preview/
