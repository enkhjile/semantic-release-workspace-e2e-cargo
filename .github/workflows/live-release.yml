name: Cargo alpha10 completed native checks
on:
  push:
    branches: [alpha]
permissions:
  contents: read
concurrency:
  group: cargo-live-alpha
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/alpha'
    environment: cargo-live
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: '1.99.1'
    steps:
      - name: Set job-owned cache paths
        run: |
          printf '%s\n' "npm_config_cache=$RUNNER_TEMP/shared-version-npm-cache" >> "$GITHUB_ENV"
          printf '%s\n' "CARGO_TARGET_DIR=$RUNNER_TEMP/shared-version-cargo-target" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - run: npm install --global npm@12.2.1 pnpm@12.15.0
      - run: echo "ACCEPTANCE_NPM_CLI=$(readlink -f "$(command -v npm)")" >> "$GITHUB_ENV"
      - run: echo "ACCEPTANCE_NPM_PATH=$(dirname "$(command -v npm)")" >> "$GITHUB_ENV"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: rustup toolchain install 1.99.1 --profile minimal --no-self-update
      - run: cargo test --workspace --locked
      - name: Remove only job-owned downloads and installs
        if: always()
        run: rm -rf node_modules .yarn .pnp.cjs .pnp.loader.mjs vendor/shared-version-candidate.tgz "$RUNNER_TEMP/shared-version-candidate-source" "$RUNNER_TEMP/shared-version-npm-cache" "$RUNNER_TEMP/shared-version-pnpm-store" "$RUNNER_TEMP/shared-version-cargo-target"
