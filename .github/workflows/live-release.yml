name: Cargo live OIDC acceptance
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the two approved alpha versions after trusted-publisher setup
        type: boolean
        default: false
permissions:
  contents: write
  id-token: write
concurrency:
  group: workspace-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/alpha3-live'
    runs-on: ubuntu-latest
    environment: cargo-live
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm install --global npm@12.2.1
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: cargo test --workspace --locked
      - name: Record source boundary
        run: |
          mkdir -p evidence/alpha3/live
          git rev-parse HEAD > evidence/alpha3/live/source-before.txt
          git status --porcelain > evidence/alpha3/live/status-before.txt
          git ls-remote origin > evidence/alpha3/live/refs-before.txt
          git ls-files -z | xargs -0 sha256sum > evidence/alpha3/live/source-hashes-before.txt
          node -e "for(const k of ['CARGO_REGISTRY_TOKEN','CARGO_REGISTRIES_CRATES_IO_TOKEN'])require('node:assert/strict').ok(!process.env[k],k+' must be absent')"
      - name: Required-OIDC dry run with real GitHub identity context
        run: |
          npm exec -- semantic-release --dry-run --extends ./release.oidc.config.mjs | tee evidence/alpha3/live/dryrun.log
          git ls-remote origin > evidence/alpha3/live/refs-after-dryrun.txt
          diff evidence/alpha3/live/refs-before.txt evidence/alpha3/live/refs-after-dryrun.txt
          git ls-files -z | xargs -0 sha256sum > evidence/alpha3/live/source-hashes-after-dryrun.txt
          diff evidence/alpha3/live/source-hashes-before.txt evidence/alpha3/live/source-hashes-after-dryrun.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Plugin-owned Cargo OIDC release
        if: inputs.publish
        run: npm exec -- semantic-release --extends ./release.oidc.config.mjs | tee evidence/alpha3/live/release.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify restored source and published artifacts
        if: inputs.publish
        run: |
          git rev-parse HEAD > evidence/alpha3/live/source-after.txt
          git status --porcelain > evidence/alpha3/live/status-after.txt
          diff evidence/alpha3/live/source-before.txt evidence/alpha3/live/source-after.txt
          diff evidence/alpha3/live/status-before.txt evidence/alpha3/live/status-after.txt
          git ls-files -z | xargs -0 sha256sum > evidence/alpha3/live/source-hashes-after.txt
          diff evidence/alpha3/live/source-hashes-before.txt evidence/alpha3/live/source-hashes-after.txt
          node scripts/live-proof.mjs
      - name: No-change release
        if: inputs.publish
        run: |
          git ls-remote origin > evidence/alpha3/live/refs-complete.txt
          npm exec -- semantic-release --extends ./release.oidc.config.mjs | tee evidence/alpha3/live/no-change.log
          git ls-remote origin > evidence/alpha3/live/refs-rerun.txt
          diff evidence/alpha3/live/refs-complete.txt evidence/alpha3/live/refs-rerun.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: cargo-live-alpha3
          path: evidence/alpha3/live/
